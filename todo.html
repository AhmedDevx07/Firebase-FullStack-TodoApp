<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProTodo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="todo.css" />
  </head>
  <body>
    <nav class="navbar d-flex justify-content-between align-items-center">
      <div class="brand-logo">
        <i class="fas fa-layer-group me-2"></i>ProTodo
      </div>
      <button class="btn btn-logout btn-sm border-0 fw-bold" id="logout">
        <i class="fas fa-power-off me-2"></i>Logout
      </button>
    </nav>

    <div class="main-wrapper">
      <aside class="sidebar">
        <div class="form-card">
          <h4 class="fw-bold mb-4">New Task</h4>

          <label class="small fw-bold text-muted">Title</label>
          <input
            type="text"
            id="taskTitle"
            class="form-control custom-input"
            placeholder="Enter task title"
          />

          <label class="small fw-bold text-muted">Category</label>
          <select id="taskCategory" class="form-select custom-input">
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="Urgent">Urgent</option>
          </select>

          <label class="small fw-bold text-muted">Description</label>
          <textarea
            id="taskDesc"
            class="form-control custom-input"
            rows="4"
            placeholder="Briefly describe the task..."
          ></textarea>

          <button class="btn-create" id="submitBtn">
            <i class="fas fa-plus-circle me-2"></i>Save Task
          </button>
          <button class="btn-create" id="update_data">
            <i class="fas fa-plus-circle me-2"></i>Update Task
          </button>
        </div>
      </aside>

      <main class="content-area">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 class="fw-bold">Tasks Dashboard</h2>
          <div id="statusCount" class="badge rounded-pill px-3 py-2">
            0 Total
          </div>
        </div>

        <div id="taskGrid" class="row"></div>
      </main>
    </div>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="todo.js"></script>
  </body>
</html>
